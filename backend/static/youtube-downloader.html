<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>YouTube to MP3 and MP4 | AudionLabs</title>
  <meta name="description" content="Save a YouTube video as MP3 or MP4, then send the audio straight to the AudionLabs stem splitter.">
  <link rel="canonical" href="https://audionlabs.ai/youtube-downloader">
<!-- HEAD_COMMON -->
</head>
<body>
<!-- SPRITE -->
<!-- NAV -->

<main>
  <div class="wrap">
    <div class="tool-head">
      <h1>YouTube Downloader</h1>
      <p>Paste a link, pick a format, and save it. Only download content you have the right to use.</p>
    </div>

    <!-- Download card -->
    <div id="download-card" class="card stack">
      <input id="url-input" class="field" type="url" placeholder="https://youtube.com/watch?v=..." autocomplete="off" spellcheck="false" aria-label="YouTube URL">

      <div id="format-toggle" class="seg" role="group" aria-label="Format">
        <button class="format-btn active" data-format="mp3" type="button">MP3 audio</button>
        <button class="format-btn" data-format="mp4" type="button">MP4 video</button>
      </div>

      <button id="download-btn" type="button">Download</button>

      <div id="progress-container" class="hidden">
        <div id="progress-track" class="bar"><div id="progress-fill"></div></div>
        <p id="progress-text" class="busy-text" style="text-align:center">Downloading...</p>
      </div>

      <p id="error-msg" class="err-inline hidden" role="alert"></p>
    </div>

    <!-- Result card -->
    <div id="result-card" class="card hidden">
      <div class="result-row">
        <span id="result-icon" class="file-icon"></span>
        <span id="result-filename"></span>
        <a id="result-download" class="download-link">Save file</a>
      </div>
    </div>

    <!-- Process with AudionLabs -->
    <div id="audionlabs-card" class="card hidden">
      <h2>Keep going with this track</h2>
      <div class="toggle-row">
        <label class="toggle-card">
          <div>
            <span class="toggle-label">Split stems</span>
            <span class="toggle-desc">Vocals, drums, bass, and other</span>
          </div>
          <div class="pill-switch">
            <input type="checkbox" id="flag-stems">
            <div class="pill-track"><div class="pill-thumb"></div></div>
          </div>
        </label>
        <label class="toggle-card">
          <div>
            <span class="toggle-label">Signature slowed render</span>
            <span class="toggle-desc">0.9x speed with a warm low-pass</span>
          </div>
          <div class="pill-switch">
            <input type="checkbox" id="flag-slowed">
            <div class="pill-track"><div class="pill-thumb"></div></div>
          </div>
        </label>
      </div>
      <button id="process-btn" type="button">Process track</button>

      <div id="al-progress-container" class="hidden">
        <div id="al-progress-track" class="bar"><div id="al-progress-fill"></div></div>
        <p id="al-progress-text" class="busy-text" style="text-align:center">Processing...</p>
      </div>
    </div>

    <!-- Processing results -->
    <div id="audionlabs-results" class="card hidden">
      <div class="results-header">
        <div class="results-check"><svg class="i" style="width:18px;height:18px;stroke-width:2.4"><use href="#i-check"/></svg></div>
        <h2>Your files are ready</h2>
      </div>
      <div id="al-results-stems" class="result-group hidden">
        <p class="result-group-label">Stems</p>
        <div class="result-links"></div>
      </div>
      <div id="al-results-slowed" class="result-group hidden">
        <p class="result-group-label">Slowed</p>
        <div class="result-links"></div>
      </div>
    </div>

    <div class="more">
      <p>More tools</p>
      <div>
        <a class="btn btn-ghost btn-sm" href="/stems">Stem Splitter</a>
        <a class="btn btn-ghost btn-sm" href="/slowed-reverb">Slowed + Reverb</a>
        <a class="btn btn-ghost btn-sm" href="/transcribe">Transcribe</a>
      </div>
    </div>
  </div>
</main>

<!-- FOOTER -->
<script src="/static/app.js?v=__V__"></script>
</body>
</html>
